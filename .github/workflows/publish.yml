name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dev_tag:
        description: 'Optional lowercase development name (published with dev- prefix)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate publication policy
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEV_TAG: ${{ inputs.dev_tag }}
        run: python3 deploy/ghcr_policy.py

  checks:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  publish:
    needs: [policy, checks]
    if: ${{ needs.policy.result == 'success' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # All publications to this repository share one lock. Pending runs may be
    # replaced by GitHub; running publications are never cancelled by a new one.
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Recheck the fetched tag and branch after waiting for CI/the lock.
      - name: Revalidate publication policy
        id: policy
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEV_TAG: ${{ inputs.dev_tag }}
        run: python3 deploy/ghcr_policy.py
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.policy.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=ci-amd64
            type=gha,scope=ci-arm64
