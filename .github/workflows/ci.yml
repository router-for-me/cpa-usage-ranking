name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: make fmt-check
      - name: Vet and test Go
        run: |
          go mod tidy -diff
          go vet ./...
          go test -p 2 ./...
      - name: Test deployment policies
        run: python3 -m unittest discover -s deploy/test -p 'test_*.py'
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web run build

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # GitHub-hosted AMD64 runners only: register QEMU 10 for this disposable
      # runner. The ARM64 smoke check is emulated, not native ARM execution.
      - name: Set up ARM64 emulation
        if: ${{ matrix.arch == 'arm64' }}
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v10.0.4
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build and load single-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          load: true
          push: false
          tags: cpa-usage-ranking:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
      - name: Exercise image
        env:
          ARCH: ${{ matrix.arch }}
          WORK_DIR: ${{ runner.temp }}
        run: python3 deploy/test/docker_smoke.py --image "cpa-usage-ranking:ci-$ARCH" --arch "$ARCH" --work-dir "$WORK_DIR"

  gate:
    if: ${{ always() }}
    needs: [backend, frontend, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require every check to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: python3 deploy/ci_gate.py
